# Sistema completo: banco, API de ingestão dos sensores e os três servidores regionais.
#   cp .env.example .env && docker compose up --build
# API dos sensores: http://localhost:8000   Painéis: http://localhost:8081, :8082, :8083
include:
  - servidor/docker-compose.yml

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_SENHA:?defina PG_SENHA no arquivo .env}
      POSTGRES_DB: alertas
    volumes:
      - dados_pg:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/leituras_sensor.sql:/docker-entrypoint-initdb.d/02_leituras_sensor.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alertas"]
      interval: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${PG_SENHA}@db:5432/alertas
      NOS_URL: http://no1:8080,http://no2:8080,http://no3:8080
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  dados_pg:
